[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "butterfly-effect-signal-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Ingestion
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.3",
    "pdfplumber>=0.11.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",

    # Scheduling
    "apscheduler>=3.10.4",

    # Message bus
    "redis>=5.0.4",

    # Embedding + vector store
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.9.1",

    # Reasoning layer
    "langgraph>=0.1.5",
    "langchain-core>=0.2.5",
    "openai>=1.30.1",

    # Config + secrets
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",

    # Action gateway
    "python-telegram-bot>=21.3",
    "twilio>=9.1.0",
    "httpx>=0.27.0",   # ntfy push via plain HTTP

    # Observability
    "structlog>=24.2.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "hypothesis>=6.103.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["besm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"